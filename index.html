<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八起式 Trade Log v0.4</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#0d1117;color:#eee;margin:0}.w{max-width:1000px;margin:auto;padding:16px}.c{background:#171d25;border:1px solid #303846;border-radius:14px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.m{font-size:22px;font-weight:800}.mut{color:#9aa5b4;font-size:12px}.good{color:#38d98a}.bad{color:#ff6b72}button,input,select,textarea{padding:10px;border-radius:9px;border:1px solid #303846;background:#10151c;color:#eee}button{font-weight:800}.pri{background:#806ff0}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{white-space:nowrap}.tab{display:none}.tab.on{display:block}.f{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.full{grid-column:1/-1}input,select,textarea{width:100%}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid #303846;text-align:right}td:first-child,th:first-child{text-align:left}.scroll{overflow:auto}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:58px;background:#10151c;border:1px solid #303846;border-radius:8px;padding:5px}.row{display:grid;grid-template-columns:1.4fr .7fr .7fr .8fr;gap:5px;padding:8px;border-bottom:1px solid #303846}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.fleet-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.fleet-list{display:grid;gap:10px}.fleet-card{background:#171d25;border:1px solid #303846;border-radius:14px;padding:14px}.fleet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.fleet-name{font-size:18px;font-weight:800;line-height:1.3}.role{font-size:11px;color:#c9c3ff;background:#242033;border:1px solid #49416d;border-radius:999px;padding:4px 8px;white-space:nowrap}.fleet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#10151c;border:1px solid #262e3a;border-radius:9px;padding:9px}.label{font-size:11px;color:#9aa5b4}.value{font-weight:750;font-variant-numeric:tabular-nums}.fleet-foot{display:flex;justify-content:space-between;align-items:end;margin-top:10px}.pnl{font-size:18px;font-weight:850}.mini{padding:7px 10px;font-size:12px}.fleet-actions{display:flex;gap:6px;align-items:center}.weight{font-size:12px;color:#9aa5b4;margin-top:3px}@media(max-width:700px){.g,.f{grid-template-columns:repeat(2,1fr)}.fleet-summary{grid-template-columns:1fr}.fleet-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class=w>
<h2>八起式 Trade Log <span class=mut>v0.4</span></h2><div class=mut>勝ち方を記録し、艦隊を管理し、再現性を測る。</div>
<div class=tabs><button class=pri onclick="tab('home',this)">司令室</button><button onclick="tab('trade',this)">戦績ログ</button><button onclick="tab('fleet',this)">艦隊状況</button><button onclick="tab('cal',this)">カレンダー</button><button onclick="tab('ana',this)">分析</button></div>
<section id=home class="tab on"><div class=g><div class=c><div class=mut>実現損益</div><div id=total class=m>¥0</div></div><div class=c><div class=mut>勝率</div><div id=win class=m>0%</div></div><div class=c><div class=mut>PF</div><div id=pf class=m>—</div></div><div class=c><div class=mut>保有評価額</div><div id=fval class=m>¥0</div></div></div><div class=c><b>八起式チェック</b><p id=diag></p></div></section>
<section id=trade class=tab><div class=c><b>取引登録</b><div class=f><input id=dt type=date><input id=sym placeholder=銘柄><select id=side><option>買い</option><option>空売り</option></select><input id=q type=number value=100 placeholder=株数><input id=en type=number placeholder=IN><input id=ex type=number placeholder=OUT><select id=dec><option>買え</option><option>待て</option><option>やめろ</option></select><select id=set><option>反転波取り</option><option>VWAP奪還</option><option>25日線乖離</option><option>暴落拾い</option><option>高値追い</option><option>その他</option></select><input id=stop type=number placeholder=事前撤退ライン><textarea id=note class=full placeholder="IN理由 / OUT理由 / 反省"></textarea><button class="pri full" onclick=addT()>記録する</button></div></div><div class="c scroll"><table><thead><tr><th>日付/銘柄</th><th>型</th><th>IN→OUT</th><th>株数</th><th>損益</th><th></th></tr></thead><tbody id=trs></tbody></table></div></section>
<section id=fleet class=tab><div class=c><b>艦隊登録</b><div class=f><input id=ps placeholder=銘柄><input id=pc placeholder=コード><input id=pq type=number placeholder=株数><input id=pa type=number placeholder=平均取得><input id=pp type=number placeholder=現在値><select id=pr><option>主戦</option><option>中長期</option><option>配当・守備</option><option>偵察</option><option>整理候補</option></select><button class=pri onclick=addP()>追加 / 更新</button></div><div class=actions><button onclick=seed()>今回のiSPEEDスクショを読み込む</button><button onclick=dedupe()>重複を整理</button></div><div class=mut style="margin-top:8px">同じ証券コードは追加せず更新します。画像由来の数値は登録後に確認してください。</div><div class=fleet-summary><div class=stat><div class=label>保有銘柄数</div><div id=fleetCount class=value>0</div></div><div class=stat><div class=label>保有評価額</div><div id=fleetValue class=value>¥0</div></div><div class=stat><div class=label>含み損益合計</div><div id=fleetPnl class=value>¥0</div></div></div></div><div id=fleetCards class=fleet-list></div></section>
<section id=cal class=tab><div class=c><div style="display:flex;justify-content:space-between"><button onclick=mv(-1)>‹</button><b id=mt></b><button onclick=mv(1)>›</button></div><div id=calendar class=cal></div></div></section>
<section id=ana class=tab><div class=c><b>型別成績</b><div id=aset></div></div><div class=c><b>銘柄別成績</b><div id=asym></div></div></section>
</div><script>
const T='yakkiT02',P='yakkiP02';let ts=JSON.parse(localStorage.getItem(T)||'[]'),pss=JSON.parse(localStorage.getItem(P)||'[]'),cm=new Date();dt.value=new Date().toISOString().slice(0,10);const Y=n=>'¥'+Math.round(n).toLocaleString(),pl=t=>(t.side==='空売り'?-1:1)*(t.ex-t.en)*t.q;
function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('pri'));b.classList.add('pri');R()}
function save(){localStorage.setItem(T,JSON.stringify(ts));localStorage.setItem(P,JSON.stringify(pss));R()}
function addT(){if(!sym.value||!+q.value||!+en.value||!+ex.value)return alert('銘柄・株数・IN・OUTを入力');ts.unshift({id:Date.now(),dt:dt.value,s:sym.value,side:side.value,q:+q.value,en:+en.value,ex:+ex.value,dec:dec.value,set:set.value,stop:+stop.value||null,note:note.value});save()}
function addP(){if(!ps.value||!+pq.value||!+pa.value||!+pp.value)return alert('銘柄・株数・取得・現在値を入力');let code=pc.value.trim(),i=code?pss.findIndex(x=>x.c===code):-1,o={id:i>=0?pss[i].id:Date.now(),s:ps.value,c:code,q:+pq.value,a:+pa.value,p:+pp.value,r:pr.value};if(i>=0)pss[i]=o;else pss.push(o);save()}
function seed(){let a=[['キオクシアHD','285A',12,18763,13510],['日本たばこ産業','2914',305,5681,7502],['ラサ工業','4022',200,2109,1700],['楽天グループ','4755',100,700.3,646.5],['JX金属','5016',100,3610,3051],['日本製鉄','5401',200,670,663.1],['大同特殊鋼','5471',100,2436,2354],['フジクラ','5803',400,4612.47,4347],['キューデン…','642A',500,1692,1979.5],['安川電機','6506',100,5143,4204],['シャープ','6753',1200,633.83,594],['AKIBA HD','6840',100,875,705],['三菱重工業','7011',300,4508,3721],['トヨタ自動車','7203',200,2695.5,3094],['伊藤忠商事','8001',300,1986,2304],['三菱UFJ FG','8306',300,3529,3431],['三菱HCキャピタル','8593',400,1351.22,1313.5],['NTT','9432',100,148,176.2],['ソフトバンク','9434',300,211,246.6]];a.forEach((x,i)=>{let j=pss.findIndex(p=>p.c===x[1]),o={id:j>=0?pss[j].id:Date.now()+i,s:x[0],c:x[1],q:x[2],a:x[3],p:x[4],r:j>=0?pss[j].r:'中長期'};if(j>=0)pss[j]=o;else pss.push(o)});save();alert('iSPEED保有データを更新しました。現在 '+pss.length+'銘柄です。')}
function dedupe(){let m=new Map();pss.forEach(p=>m.set((p.c||p.s).trim(),p));let n=pss.length;pss=[...m.values()];save();alert(n===pss.length?'重複はありません。':'重複 '+(n-pss.length)+'件を整理。現在 '+pss.length+'銘柄です。')}
function delT(i){ts=ts.filter(x=>x.id!=i);save()}
function editP(i){let o=pss.find(x=>x.id==i);if(!o)return;let s=prompt('銘柄名',o.s);if(s===null)return;let code=prompt('証券コード',o.c||'');if(code===null)return;code=code.trim();if(code&&pss.some(x=>x.id!=i&&x.c===code))return alert('同じ証券コードが既に登録されています。');let qv=prompt('株数',o.q);if(qv===null)return;let av=prompt('平均取得',o.a);if(av===null)return;let pv=prompt('現在値',o.p);if(pv===null)return;let role=prompt('役割：主戦 / 中長期 / 配当・守備 / 偵察 / 整理候補',o.r||'中長期');if(role===null)return;let qn=Number(qv),an=Number(av),pn=Number(pv);if(!s.trim()||!qn||!an||!pn)return alert('銘柄・株数・平均取得・現在値を確認してください。');pss=pss.map(x=>x.id==i?{...x,s:s.trim(),c:code,q:qn,a:an,p:pn,r:role.trim()||o.r}:x);save()}
function delP(i){let o=pss.find(x=>x.id==i);if(!o)return;if(!confirm(o.s+'を艦隊から削除しますか？'))return;pss=pss.filter(x=>x.id!=i);save()}
function group(k){let g={};ts.forEach(t=>(g[t[k]]??=[]).push(pl(t)));return Object.entries(g).map(([n,a])=>{let s=a.reduce((x,y)=>x+y,0),w=a.filter(x=>x>0).length;return `<div class=row><b>${n}</b><span>${a.length}戦</span><span>${Math.round(w/a.length*100)}%</span><span class=${s>=0?'good':'bad'}>${s>=0?'+':''}${Y(s)}</span></div>`}).join('')||'<p class=mut>戦績が貯まると表示。</p>'}
function mv(n){cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);calR()}
function calR(){let y=cm.getFullYear(),m=cm.getMonth();mt.textContent=`${y}年${m+1}月`;let h=['日','月','火','水','木','金','土'].map(x=>`<div class=mut style=text-align:center>${x}</div>`).join(''),f=new Date(y,m,1).getDay(),dmax=new Date(y,m+1,0).getDate();for(let i=0;i<f;i++)h+='<div></div>';for(let d=1;d<=dmax;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=ts.filter(t=>t.dt===ds),v=a.reduce((s,t)=>s+pl(t),0);h+=`<div class=day>${d}${a.length?`<div class=${v>=0?'good':'bad'}><b>${v>=0?'+':''}${Y(v)}</b></div><div class=mut>${a.length}取引</div>`:''}</div>`}calendar.innerHTML=h}
function fleetR(){let tv=pss.reduce((s,p)=>s+p.q*p.p,0),tp=pss.reduce((s,p)=>s+(p.p-p.a)*p.q,0);fleetCards.innerHTML=pss.map(p=>{let v=p.q*p.p,u=(p.p-p.a)*p.q,wt=tv?v/tv*100:0;return `<article class=fleet-card><div class=fleet-head><div><div class=fleet-name>${p.s}</div><div class=mut>${p.c||'コード未登録'}</div><div class=weight>保有比率 ${wt.toFixed(1)}%</div></div><div class=role>${p.r||'未分類'}</div></div><div class=fleet-grid><div class=stat><div class=label>株数</div><div class=value>${Number(p.q).toLocaleString()}</div></div><div class=stat><div class=label>平均取得</div><div class=value>${Number(p.a).toLocaleString()}</div></div><div class=stat><div class=label>現在値</div><div class=value>${Number(p.p).toLocaleString()}</div></div><div class=stat><div class=label>評価額</div><div class=value>${Y(v)}</div></div></div><div class=fleet-foot><div><div class=mut>含み損益</div><div class="pnl ${u>=0?'good':'bad'}">${u>=0?'+':''}${Y(u)}</div></div><div class=fleet-actions><button class=mini onclick=editP(${p.id})>編集</button><button class=mini onclick=delP(${p.id})>削除</button></div></div></article>`}).join('')||'<div class="c mut">保有銘柄を登録するとカード表示されます。</div>';fleetCount.textContent=pss.length+'銘柄';fleetValue.textContent=Y(tv);fleetPnl.textContent=(tp>=0?'+':'')+Y(tp);fleetPnl.className='value '+(tp>=0?'good':'bad')}
function R(){let a=ts.map(pl),w=a.filter(x=>x>0),l=a.filter(x=>x<0),gp=w.reduce((x,y)=>x+y,0),gl=-l.reduce((x,y)=>x+y,0),tot=a.reduce((x,y)=>x+y,0),fv=pss.reduce((s,p)=>s+p.q*p.p,0);total.textContent=Y(tot);total.className='m '+(tot>=0?'good':'bad');win.textContent=ts.length?Math.round(w.length/ts.length*100)+'%':'0%';pf.textContent=gl?(gp/gl).toFixed(2):(gp?'∞':'—');fval.textContent=Y(fv);diag.innerHTML=pss.length>=12?`保有は <b>${pss.length}銘柄</b>。まず役割分担と集中度を確認。戦績が5件以上になると型別PFの評価へ進む。`:'データを登録すると診断を開始。';trs.innerHTML=ts.map(t=>{let v=pl(t);return `<tr><td>${t.s}<br><span class=mut>${t.dt}</span></td><td>${t.set}<br><span class=mut>${t.dec}</span></td><td>${t.en}→${t.ex}</td><td>${t.q}</td><td class=${v>=0?'good':'bad'}>${v>=0?'+':''}${Y(v)}</td><td><button onclick=delT(${t.id})>×</button></td></tr>`}).join('');aset.innerHTML=group('set');asym.innerHTML=group('s');fleetR();calR()}R()
</script></body></html>
