<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八起式 Trade Log v0.2</title>
<style>body{font-family:system-ui;background:#0d1117;color:#eee;margin:0}.w{max-width:1000px;margin:auto;padding:16px}.c{background:#171d25;border:1px solid #303846;border-radius:14px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.m{font-size:22px;font-weight:800}.mut{color:#9aa5b4;font-size:12px}.good{color:#38d98a}.bad{color:#ff6b72}button,input,select,textarea{padding:10px;border-radius:9px;border:1px solid #303846;background:#10151c;color:#eee}button{font-weight:800}.pri{background:#806ff0}.tabs{display:flex;gap:6px;overflow:auto}.tab{display:none}.tab.on{display:block}.f{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.full{grid-column:1/-1}input,select,textarea{width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid #303846;text-align:right}td:first-child,th:first-child{text-align:left}.scroll{overflow:auto}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:58px;background:#10151c;border:1px solid #303846;border-radius:8px;padding:5px}.row{display:grid;grid-template-columns:1.4fr .7fr .7fr .8fr;gap:5px;padding:8px;border-bottom:1px solid #303846}@media(max-width:700px){.g,.f{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class=w><h2>八起式 Trade Log <span class=mut>v0.2</span></h2><div class=mut>勝ち方を記録し、艦隊を管理し、再現性を測る。</div>
<div class=tabs><button class=pri onclick="tab('home',this)">司令室</button><button onclick="tab('trade',this)">戦績ログ</button><button onclick="tab('fleet',this)">艦隊状況</button><button onclick="tab('cal',this)">カレンダー</button><button onclick="tab('ana',this)">分析</button></div>
<section id=home class="tab on"><div class=g><div class=c><div class=mut>実現損益</div><div id=total class=m>¥0</div></div><div class=c><div class=mut>勝率</div><div id=win class=m>0%</div></div><div class=c><div class=mut>PF</div><div id=pf class=m>—</div></div><div class=c><div class=mut>保有評価額</div><div id=fval class=m>¥0</div></div></div><div class=c><b>八起式チェック</b><p id=diag></p></div></section>
<section id=trade class=tab><div class=c><b>取引登録</b><div class=f><input id=dt type=date><input id=sym placeholder=銘柄><select id=side><option>買い</option><option>空売り</option></select><input id=q type=number value=100 placeholder=株数><input id=en type=number placeholder=IN><input id=ex type=number placeholder=OUT><select id=dec><option>買え</option><option>待て</option><option>やめろ</option></select><select id=set><option>反転波取り</option><option>VWAP奪還</option><option>25日線乖離</option><option>暴落拾い</option><option>高値追い</option><option>その他</option></select><input id=stop type=number placeholder=事前撤退ライン><textarea id=note class=full placeholder="IN理由 / OUT理由 / 反省"></textarea><button class="pri full" onclick=addT()>記録する</button></div></div><div class="c scroll"><table><thead><tr><th>日付/銘柄</th><th>型</th><th>IN→OUT</th><th>株数</th><th>損益</th><th></th></tr></thead><tbody id=trs></tbody></table></div></section>
<section id=fleet class=tab><div class=c><b>艦隊登録</b><div class=f><input id=ps placeholder=銘柄><input id=pc placeholder=コード><input id=pq type=number placeholder=株数><input id=pa type=number placeholder=平均取得><input id=pp type=number placeholder=現在値><select id=pr><option>主戦</option><option>中長期</option><option>配当・守備</option><option>偵察</option><option>整理候補</option></select><button class=pri onclick=addP()>追加</button></div><p><button onclick=seed()>今回のiSPEEDスクショを読み込む</button></p><div class=mut>画像から読めた保有値を初期登録。登録後に必ず数値を確認してください。</div></div><div class="c scroll"><table><thead><tr><th>銘柄</th><th>株数</th><th>取得</th><th>現在値</th><th>評価額</th><th>含み</th><th></th></tr></thead><tbody id=prs></tbody></table></div></section>
<section id=cal class=tab><div class=c><div style="display:flex;justify-content:space-between"><button onclick=mv(-1)>‹</button><b id=mt></b><button onclick=mv(1)>›</button></div><div id=calendar class=cal></div></div></section>
<section id=ana class=tab><div class=c><b>型別成績</b><div id=aset></div></div><div class=c><b>銘柄別成績</b><div id=asym></div></div></section>
</div><script>
const T='yakkiT02',P='yakkiP02';let ts=JSON.parse(localStorage.getItem(T)||'[]'),pss=JSON.parse(localStorage.getItem(P)||'[]'),cm=new Date();dt.value=new Date().toISOString().slice(0,10);const Y=n=>'¥'+Math.round(n).toLocaleString(),pl=t=>(t.side==='空売り'?-1:1)*(t.ex-t.en)*t.q;
function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('pri'));b.classList.add('pri');R()}
function save(){localStorage.setItem(T,JSON.stringify(ts));localStorage.setItem(P,JSON.stringify(pss));R()}
function addT(){if(!sym.value||!+q.value||!+en.value||!+ex.value)return alert('銘柄・株数・IN・OUTを入力');ts.unshift({id:Date.now(),dt:dt.value,s:sym.value,side:side.value,q:+q.value,en:+en.value,ex:+ex.value,dec:dec.value,set:set.value,stop:+stop.value||null,note:note.value});save()}
function addP(){if(!ps.value||!+pq.value||!+pa.value||!+pp.value)return alert('銘柄・株数・取得・現在値を入力');pss.push({id:Date.now(),s:ps.value,c:pc.value,q:+pq.value,a:+pa.value,p:+pp.value,r:pr.value});save()}
function seed(){if(pss.length&&!confirm('既存の艦隊に追加する？'))return;let a=[['キオクシアHD','285A',12,18763,13510],['日本たばこ産業','2914',305,5681,7502],['ラサ工業','4022',200,2109,1700],['楽天グループ','4755',100,700.3,646.5],['JX金属','5016',100,3610,3051],['日本製鉄','5401',200,670,663.1],['大同特殊鋼','5471',100,2436,2354],['フジクラ','5803',400,4612.47,4347],['キューデン…','642A',500,1692,1979.5],['安川電機','6506',100,5143,4204],['シャープ','6753',1200,633.83,594],['AKIBA HD','6840',100,875,705],['三菱重工業','7011',300,4508,3721],['トヨタ自動車','7203',200,2695.5,3094],['伊藤忠商事','8001',300,1986,2304],['三菱UFJ FG','8306',300,3529,3431],['三菱HCキャピタル','8593',400,1351.22,1313.5],['NTT','9432',100,148,176.2],['ソフトバンク','9434',300,211,246.6]];a.forEach((x,i)=>pss.push({id:Date.now()+i,s:x[0],c:x[1],q:x[2],a:x[3],p:x[4],r:'中長期'}));save()}
function delT(i){ts=ts.filter(x=>x.id!=i);save()}function delP(i){pss=pss.filter(x=>x.id!=i);save()}
function group(k){let g={};ts.forEach(t=>(g[t[k]]??=[]).push(pl(t)));return Object.entries(g).map(([n,a])=>{let s=a.reduce((x,y)=>x+y,0),w=a.filter(x=>x>0).length;return `<div class=row><b>${n}</b><span>${a.length}戦</span><span>${Math.round(w/a.length*100)}%</span><span class=${s>=0?'good':'bad'}>${s>=0?'+':''}${Y(s)}</span></div>`}).join('')||'<p class=mut>戦績が貯まると表示。</p>'}
function mv(n){cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);calR()}
function calR(){let y=cm.getFullYear(),m=cm.getMonth();mt.textContent=`${y}年${m+1}月`;let h=['日','月','火','水','木','金','土'].map(x=>`<div class=mut style=text-align:center>${x}</div>`).join(''),f=new Date(y,m,1).getDay(),dmax=new Date(y,m+1,0).getDate();for(let i=0;i<f;i++)h+='<div></div>';for(let d=1;d<=dmax;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=ts.filter(t=>t.dt===ds),v=a.reduce((s,t)=>s+pl(t),0);h+=`<div class=day>${d}${a.length?`<div class=${v>=0?'good':'bad'}><b>${v>=0?'+':''}${Y(v)}</b></div><div class=mut>${a.length}取引</div>`:''}</div>`}calendar.innerHTML=h}
function R(){let a=ts.map(pl),w=a.filter(x=>x>0),l=a.filter(x=>x<0),gp=w.reduce((x,y)=>x+y,0),gl=-l.reduce((x,y)=>x+y,0),tot=a.reduce((x,y)=>x+y,0),fv=pss.reduce((s,p)=>s+p.q*p.p,0);total.textContent=Y(tot);total.className='m '+(tot>=0?'good':'bad');win.textContent=ts.length?Math.round(w.length/ts.length*100)+'%':'0%';pf.textContent=gl?(gp/gl).toFixed(2):(gp?'∞':'—');fval.textContent=Y(fv);diag.innerHTML=pss.length>=12?`保有は <b>${pss.length}銘柄</b>。まず役割分担と集中度を確認。戦績が5件以上になると型別PFの評価へ進む。`:'データを登録すると診断を開始。';trs.innerHTML=ts.map(t=>{let v=pl(t);return `<tr><td>${t.s}<br><span class=mut>${t.dt}</span></td><td>${t.set}<br><span class=mut>${t.dec}</span></td><td>${t.en}→${t.ex}</td><td>${t.q}</td><td class=${v>=0?'good':'bad'}>${v>=0?'+':''}${Y(v)}</td><td><button onclick=delT(${t.id})>×</button></td></tr>`}).join('');prs.innerHTML=pss.map(p=>{let u=(p.p-p.a)*p.q;return `<tr><td>${p.s}<br><span class=mut>${p.c} / ${p.r}</span></td><td>${p.q}</td><td>${p.a}</td><td>${p.p}</td><td>${Y(p.q*p.p)}</td><td class=${u>=0?'good':'bad'}>${u>=0?'+':''}${Y(u)}</td><td><button onclick=delP(${p.id})>×</button></td></tr>`}).join('');aset.innerHTML=group('set');asym.innerHTML=group('s');calR()}R()
</script></body></html>
